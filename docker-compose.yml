version: '3.8'

services:
  raceday-db:
    image: mssql/server:2022-latest
    container_name: raceday-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=<YOUR_STRONG_PASSWORD>
    ports:
      - "1433:1433"

  raceday-api:
    build:
      context: .
      dockerfile: RaceDayApi/Dockerfile
    container_name: raceday-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=raceday-db,1433;Database=RaceDayApiDB;User Id=sa;Password=<YOUR_STRONG_PASSWORD>;TrustServerCertificate=True
    ports:
      - "5081:8080"
    depends_on:
      - raceday-db

  raceday-web:
    build:
      context: .
      dockerfile: RaceDayWeb/Dockerfile
    container_name: raceday-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://raceday-api:8080/api/
    ports:
      - "8080:8080"
    depends_on:
      - raceday-api
